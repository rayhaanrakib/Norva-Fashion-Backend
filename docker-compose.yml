services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://norva:norva@postgres:5432/norva?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5000
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norva
      POSTGRES_PASSWORD: norva
      POSTGRES_DB: norva
    ports:
      - "5432:5432"
    volumes:
      - norva-db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  norva-db:
